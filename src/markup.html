<div id="app" class="app">
  <div id="stage" class="stage" role="application" aria-label="Map of people and their connections">
    <div id="world" class="world">
      <svg id="edges" class="edges" width="1" height="1" aria-hidden="true">
        <g id="edge-g"></g>
        <path id="ghost" class="ghost" d="" hidden></path>
      </svg>
      <div id="labels" class="labels"></div>
      <div id="nodes" class="nodes"></div>
    </div>
  </div>

  <header class="topbar">
    <div class="brand glass">
      <svg class="mark" viewBox="0 0 28 28" aria-hidden="true">
        <path d="M7.5 19.5C9 12 15 8.5 20.5 8.5" fill="none" stroke="var(--c-friend)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M7.5 19.5C12 21.5 17 20 20.5 15.5" fill="none" stroke="var(--c-family)" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="7.5" cy="19.5" r="4.6" fill="var(--ink)"/>
        <circle cx="20.5" cy="8.5" r="3.6" fill="var(--hl)" stroke="var(--ink)" stroke-width="1.6"/>
        <circle cx="20.5" cy="15.5" r="2.4" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.6"/>
      </svg>
      <span class="wordmark">kith</span>
      <span id="sync" class="sync" title="Saved"></span>
      <span id="stats" class="stats"></span>
    </div>
    <div class="tools glass">
      <button id="btn-search" class="icon-btn" type="button" aria-label="Find a person" title="Find a person (Ctrl K)"></button>
      <button id="btn-add" class="icon-btn" type="button" aria-label="Add a person" title="Add a person"></button>
      <button id="btn-menu" class="icon-btn" type="button" aria-label="Menu" title="Menu"></button>
    </div>
  </header>

  <nav id="filters" class="filters" aria-label="Show one kind of relationship"></nav>

  <div class="mapctl glass" role="group" aria-label="Zoom">
    <button id="btn-zin" class="icon-btn" type="button" aria-label="Zoom in" title="Zoom in"></button>
    <button id="btn-zout" class="icon-btn" type="button" aria-label="Zoom out" title="Zoom out"></button>
    <button id="btn-fit" class="icon-btn" type="button" aria-label="Fit everyone on screen" title="Fit everyone"></button>
  </div>

  <section id="empty" class="empty" hidden>
    <h1>Who do you know?</h1>
    <p>Tell Kith about someone — type it, paste it, or say it. It picks out names, companies, places and how everyone is connected.</p>
    <div class="row">
      <button id="btn-example" class="btn sm" type="button">Show an example map</button>
      <button id="btn-first" class="btn sm primary" type="button">Add a person</button>
    </div>
  </section>

  <form id="composer" class="composer" autocomplete="off">
    <div class="composer-top">
      <div class="seg" role="tablist" aria-label="What the box does">
        <button type="button" role="tab" data-mode="add" aria-selected="true">Add</button>
        <button type="button" role="tab" data-mode="ask" aria-selected="false">Ask</button>
      </div>
      <span id="composer-note" class="composer-note"></span>
    </div>
    <div id="attach" class="attach" hidden></div>
    <div class="composer-row">
      <button id="btn-mic" class="mic" type="button" aria-label="Speak" title="Speak">
        <span class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      </button>
      <textarea id="input" rows="1" enterkeyhint="send" aria-label="Add or ask"></textarea>
      <button id="btn-image" class="icon-btn attach-btn" type="button" aria-label="Read a screenshot" title="Read a screenshot" hidden></button>
      <button id="btn-send" class="send" type="submit" aria-label="Add" disabled></button>
    </div>
    <div id="hint" class="hint" role="note" hidden></div>
  </form>

  <aside id="sheet" class="sheet away" role="dialog" aria-labelledby="sheet-title" hidden>
    <div id="sheet-grab" class="sheet-grab"><span></span></div>
    <div id="sheet-head" class="sheet-head">
      <button id="sheet-back" class="icon-btn" type="button" aria-label="Back" hidden></button>
      <h2 id="sheet-title"></h2>
      <button id="sheet-close" class="icon-btn" type="button" aria-label="Close"></button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
    <div id="sheet-foot" class="sheet-foot" hidden></div>
  </aside>

  <div id="toast" class="toast away" role="status" aria-live="polite" hidden></div>
  <div id="drop-zone" class="drop-zone" hidden>Drop to add</div>

  <div id="loader" class="loader">
    <div>
      <svg class="mark" viewBox="0 0 28 28" aria-hidden="true">
        <path d="M7.5 19.5C9 12 15 8.5 20.5 8.5" fill="none" stroke="var(--c-friend)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M7.5 19.5C12 21.5 17 20 20.5 15.5" fill="none" stroke="var(--c-family)" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="7.5" cy="19.5" r="4.6" fill="var(--ink)"/>
        <circle cx="20.5" cy="8.5" r="3.6" fill="var(--hl)" stroke="var(--ink)" stroke-width="1.6"/>
        <circle cx="20.5" cy="15.5" r="2.4" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.6"/>
      </svg>
      <span id="loader-text">Opening your map</span>
    </div>
  </div>

  <input id="file-image" type="file" accept="image/*" hidden>
  <input id="file-photo" type="file" accept="image/*" hidden>
  <input id="file-import" type="file" accept=".json,application/json" hidden>
</div>
